name: Release OMAC CLI

on:
  push:
    tags:
      - "v*.*"
      - "!v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: mkdir -p release-assets
      - run: npm pack --workspace @omac/cli --pack-destination release-assets
      - run: node scripts/create-cli-release-manifest.mjs --asset "$(find release-assets -name '*.tgz' -print -quit)" --version "${GITHUB_REF_NAME#v}" --out release-assets/manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
